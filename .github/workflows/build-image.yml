name: build-image

# Builds the Uno Dos Cloud Chatwoot image (stock v4.16.2 + the env-gated OIDC patch)
# and publishes it to GHCR. Runs on every push to unodos/oidc (e.g. after a
# sync-upstream merge), and can be triggered manually.
#
# Image tags published:
#   ghcr.io/<owner>/<repo>:v<UPSTREAM_TAG>-oidc.<run>   (e.g. v4.16.2-oidc.1)
#   ghcr.io/<owner>/<repo>:latest-oidc                  (convenience)
#
# The Docker build is the official chatwoot docker/Dockerfile from a full checkout
# (needs .git for the version stamp). The smoke test only asserts the image is
# healthy and the OIDC gem is present; the full Authentik round-trip is a manual
# staging step documented in docs/oidc-sso.md.

on:
  push:
    branches: [unodos/oidc]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }} # → ghcr.io/<owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history + tags for .git_sha / describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version tags
        id: version
        run: |
          upstream_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo unknown)
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${upstream_tag}-oidc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest-oidc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — gem present in the built image
        run: |
          docker run --rm --entrypoint sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}" \
            -lc 'bundle check && ruby -e "require \"omniauth_openid_connect\"; puts \"oidc gem OK (strategy: #{OmniAuth::Strategies::OpenIDConnect})\""'

      - name: Smoke test — fork marker present
        run: |
          docker run --rm --entrypoint sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}" \
            -lc 'test -d /app/custom && echo "custom/ extension dir present in /app"'
